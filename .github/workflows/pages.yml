name: Deploy Lab 3 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check project and algorithm fixtures
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5
      - name: Prepare the static site
        run: |
          mkdir _site
          cp index.html styles.css app.js processing.js worker.js site-config.js .nojekyll _site/
          cp -r assets downloads python _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
